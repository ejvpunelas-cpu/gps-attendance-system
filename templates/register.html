
{% extends "base.html" %}

{% block title %}Register | Campus Classroom{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <img
                src="{{ url_for('static', filename='images/pup-logo.png') }}"
                alt="PUP Calauan Logo"
                class="auth-logo"
                onerror="this.style.display='none'"
            >

            <h1>Create Account</h1>
            <p>Register for Campus Classroom.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <!-- ACCOUNT TYPE -->
            <div class="form-group">
                <label for="role">Account Type</label>

                <select id="role" name="role" required>
                    <option value="student" selected>Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <!-- STUDENT SECTION -->
            <div class="form-group" id="section-group">
                <label for="section">Section</label>

                <input
                    type="text"
                    id="section"
                    name="section"
                    placeholder="Example: BSIT 1-2"
                >
            </div>

            <!-- TEACHER AUTHORIZATION CODE -->
            <div
                class="form-group"
                id="teacher-code-group"
                style="display: none;"
            >
                <label for="teacher_code">
                    Teacher Authorization Code
                </label>

                <input
                    type="password"
                    id="teacher_code"
                    name="teacher_code"
                    placeholder="Enter teacher authorization code"
                    autocomplete="off"
                >

                <small>
                    Enter the authorization code provided by the administrator.
                </small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <small>Use at least 8 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary auth-button"
            >
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in here</a>
        </p>

    </div>
</section>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.auth-card {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    border-top: 5px solid #800000;
}

.auth-header {
    text-align: center;
    margin-bottom: 28px;
}

.auth-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 12px;
}

.auth-header h1 {
    color: #800000;
    margin: 0 0 8px;
}

.auth-header p {
    color: #666;
    margin: 0;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #800000;
    box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.1);
}

.form-group small {
    display: block;
    margin-top: 6px;
    color: #777;
}

.auth-button {
    width: 100%;
    margin-top: 5px;
}

.auth-footer {
    text-align: center;
    margin: 22px 0 0;
    color: #666;
}

.auth-footer a {
    color: #800000;
    font-weight: bold;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}

@media (max-width: 500px) {
    .auth-card {
        padding: 24px 20px;
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const roleSelect = document.getElementById("role");

    const sectionGroup = document.getElementById("section-group");
    const sectionInput = document.getElementById("section");

    const teacherCodeGroup = document.getElementById("teacher-code-group");
    const teacherCodeInput = document.getElementById("teacher_code");

    function updateAccountFields() {
        if (roleSelect.value === "teacher") {

            // Hide the section field for teachers
            sectionGroup.style.display = "none";
            sectionInput.required = false;
            sectionInput.value = "";

            // Show the teacher authorization field
            teacherCodeGroup.style.display = "block";
            teacherCodeInput.required = true;

        } else {

            // Show the section field for students
            sectionGroup.style.display = "block";
            sectionInput.required = true;

            // Hide the teacher authorization field
            teacherCodeGroup.style.display = "none";
            teacherCodeInput.required = false;
            teacherCodeInput.value = "";
        }
    }

    roleSelect.addEventListener("change", updateAccountFields);

    // Set the correct fields when the page loads
    updateAccountFields();
});
</script>

{% endblock %}
