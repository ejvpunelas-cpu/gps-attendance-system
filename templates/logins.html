{% extends "base.html" %}

{% block title %}Login | Campus Classroom{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img
                src="{{ url_for('static', filename='images/pup-logo.png') }}"
                alt="PUP Calauan Logo"
                class="auth-logo"
                onerror="this.style.display='none'"
            >
            <h1>Welcome Back!</h1>
            <p>Log in to your Campus Classroom account.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary auth-button">
                Log In
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </div>
</section>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.auth-card {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    border-top: 5px solid #800000;
}

.auth-header {
    text-align: center;
    margin-bottom: 28px;
}

.auth-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 12px;
}

.auth-header h1 {
    color: #800000;
    margin: 0 0 8px;
}

.auth-header p {
    color: #666;
    margin: 0;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

.form-group input:focus {
    outline: none;
    border-color: #800000;
    box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.1);
}

.auth-button {
    width: 100%;
    margin-top: 5px;
}

.auth-footer {
    text-align: center;
    margin: 22px 0 0;
    color: #666;
}

.auth-footer a {
    color: #800000;
    font-weight: bold;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
```
