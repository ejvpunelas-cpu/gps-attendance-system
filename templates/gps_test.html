
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPS Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
        }

        p {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>GPS Location Test</h1>

        <p>This test only reads your location for display.
        It does not save your coordinates or change attendance.</p>

        <button onclick="getLocation()">Test My GPS</button>

        <p id="status">Waiting to test GPS...</p>
        <p id="latitude"></p>
        <p id="longitude"></p>
        <p id="accuracy"></p>

        <a href="/dashboard">Back to Dashboard</a>
    </div>

    <script>
        function getLocation() {
            const status = document.getElementById("status");

            if (!navigator.geolocation) {
                status.textContent =
                    "Your browser does not support location access.";
                return;
            }

            status.textContent = "Requesting your location...";

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    document.getElementById("latitude").textContent =
                        "Latitude: " + position.coords.latitude;

                    document.getElementById("longitude").textContent =
                        "Longitude: " + position.coords.longitude;

                    document.getElementById("accuracy").textContent =
                        "Estimated accuracy: " +
                        Math.round(position.coords.accuracy) + " meters";

                    status.textContent = "GPS location obtained!";
                },

                function(error) {
                    if (error.code === 1) {
                        status.textContent =
                            "Permission denied. Allow location access in Chrome.";
                    } else if (error.code === 2) {
                        status.textContent =
                            "Location unavailable. Check your device location settings.";
                    } else if (error.code === 3) {
                        status.textContent =
                            "Location request timed out. Try again.";
                    } else {
                        status.textContent =
                            "Could not obtain location. Error code: " + error.code;
                    }
                },

                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }
    </script>
</body>
</html>
